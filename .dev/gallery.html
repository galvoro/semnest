<!doctype html>
<meta charset="utf-8">
<title>SEMNEST gallery</title>
<style>
  body { font: 13px system-ui; margin: 10px; background: #f4efe4; }
  .item { display: grid; grid-template-columns: 60px 1fr 1fr; gap: 8px; align-items: center; background: #fff; margin: 6px 0; padding: 6px; border-radius: 8px; }
  .item svg { width: 100%; height: 230px; background: #fffdf8; border: 1px solid #e3dccb; border-radius: 6px; }
  .id { font-weight: 700; } .rel { color: #777; font-size: 11px; }
  .dg-shape { fill: #fff; stroke: #2b2622; stroke-width: 0.035; }
  .dg-node.lat .dg-shape { fill: #e9f4f7; }
  .dg-label { font: 0.26px system-ui; fill: #2b2622; } .dg-sub { font-size: 0.17px; }
  .dg-line { fill: none; stroke: #2b2622; stroke-width: 0.03; }
  .dg-edge.net .dg-line { stroke-linecap: round; }
  .dg-head { fill: #2b2622; } .dg-head.res { fill: #9a9187; } .dg-head.diff { fill: #c56a12; }
  .dg-res-circle { fill: #fff; stroke: #9a9187; stroke-width: 0.025; }
  .dg-res-arrow { stroke: #9a9187; stroke-width: 0.025; }
  .dg-elabel { font: italic 0.2px Georgia; fill: #7a3e12; paint-order: stroke; stroke: #fffdf8; stroke-width: 0.06; }
  .dg-edge.diff .dg-line { stroke: #c56a12; }
  .dg-glow { fill: none; stroke: #f5c37a; stroke-width: 0.14; opacity: .6; stroke-linecap: round; }
  .dg-node.diff .dg-shape { stroke: #c56a12; stroke-width: 0.06; }
</style>
<div id="out"></div>
<script src="../linalg.js"></script>
<script src="../sem.js"></script>
<script src="../bank.js"></script>
<script src="../diagram.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const filt = q.get('f') || '';
  const out = document.getElementById('out');
  for (const it of SN.bank.items.filter(i => i.id.startsWith(filt))) {
    const { LA, LB } = SN.diagram.layoutItem(it);
    const bounds = SN.diagram.unionBounds([LA, LB]);
    const diff = SN.diagram.differences(LA, LB);
    const row = document.createElement('div'); row.className = 'item';
    row.innerHTML = `<div><div class="id">${it.id}</div><div class="rel">${it.rel}</div></div>`;
    for (const [L, d] of [[LA, diff.A], [LB, diff.B]]) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      row.appendChild(svg);
      SN.diagram.render(svg, L, { bounds, minW: 5.2, minH: 2.6, diff: q.get("diff") ? d : undefined });
    }
    out.appendChild(row);
  }
</script>
